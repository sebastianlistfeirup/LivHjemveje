name: Udgiv det verificerede spil
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Kontrollér den færdige eksport
        run: |
          test -s index.html
          test -s index.pck
          test -s index.wasm
          test -s manifest.webmanifest
          test -s sw.js
          mkdir -p _site
          cp index.* app-icon*.png manifest.webmanifest sw.js THIRD-PARTY-LICENSES.txt .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Udgiv spillet
        id: deployment
        uses: actions/deploy-pages@v4
