name: Kapitel 1 · build og rutekontrol
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installér Godot 4.6.3
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Importér og gennemspil AA, AB, BA, BB
        run: |
          mkdir -p test-results
          Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --quit
          timeout 120 Godot_v4.6.3-stable_linux.x86_64 --headless --script tests/test_chapter.gd
      - name: Gem ruternes gemmefiler
        uses: actions/upload-artifact@v4
        with:
          name: kapitel-1-rutekontrol
          path: test-results/*-complete.json
