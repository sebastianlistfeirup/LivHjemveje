[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="content/runtime/*.json"
exclude_filter="content/source/*,docs/*,tools/*,tests/*,test-results/*,liv_kilder/*,README.md"
export_path="builds/web/index.html"

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://tools/web_shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="content/runtime/*.json"
exclude_filter="content/source/*,docs/*,tools/*,tests/*,test-results/*,liv_kilder/*"
export_path="builds/linux/LivHjemveje.x86_64"

[preset.1.options]
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
